{% extends 'layout.html' %}

{% block title %}{{ post.titulo }} | Mi Sitio Web{% endblock %}

{% block content %}
    <article class="post-detalle">
        <header style="margin-bottom: 2rem;">
            <h1>{{ post.titulo }}</h1>
            <p style="font-size: 0.9rem; font-style: italic;">
                Publicado el {{ post.fecha }} por {{ post.autor }}
            </p>
        </header>
        
        <div class="post-cuerpo">
            <p>{{ post.contenido | safe }}</p>
        </div>

        <div style="margin-top: 3rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <a href="/" class="btn">← Volver al Inicio</a>
        </div>
    </article>
{% endblock %}
